<!doctype html>

<body>
  <a class="skip" href="#page-content">Pular para o conteúdo</a>

    <aside id="sidebar" class="sidebar" aria-label="Menu principal">

        <button id="sidebar-close" class="button icon ghost sidebar-close" type="button" aria-label="Fechar menu">×</button>

      <div class="sidebar-tenant" id="tenant-selector-wrap">

        <div id="sidebar-role" class="user-role"></div>

      </div>
    </aside>
    <div id="mobile-scrim" class="mobile-scrim" aria-hidden="true"></div>
    <div class="console-main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-button" class="button icon ghost menu-button" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="breadcrumb"><span id="breadcrumb-area">Painel</span> / <strong id="breadcrumb-current">Visão geral</strong></div>
        </div>
        <div class="topbar-right"><span class="topbar-date" id="today"></span><span class="environment">Acesso antecipado</span><div class="profile-menu-wrap"><button id="avatar" class="avatar" type="button" aria-label="Abrir menu da conta" aria-controls="profile-menu" aria-expanded="false">P</button><div id="profile-menu" class="profile-menu" hidden></div></div></div>

  <div id="dialog-root"></div>
