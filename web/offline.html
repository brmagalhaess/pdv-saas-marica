<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>Sem conexão · PDV2</title>
  <link rel="stylesheet" href="/assets/ui.css">
  <style>body{display:grid;place-items:center;min-height:100vh;padding:20px;background:#f5f8f3}.offline{width:min(490px,100%);padding:38px;border:1px solid #dce9df;border-radius:20px;background:white;box-shadow:0 20px 50px #193a2010}.offline h1{font-size:31px;margin:27px 0 10px}.offline p{color:#697b6e;font-size:14px}.offline .button{margin-top:13px}</style>
</head>
<body>
  <main class="offline">
    <div class="brand"><span class="brand-mark" aria-hidden="true">2</span><span>PDV<strong>2</strong></span></div>
    <h1>Você está sem conexão.</h1>
    <p>O painel web precisa de internet para carregar dados e concluir ações. O caixa já pareado trabalha no computador com o catálogo local e sincroniza as vendas quando a conexão voltar.</p>
    <a class="button" href="http://127.0.0.1:8010/">Abrir terminal local</a>
    <button class="button secondary" type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
