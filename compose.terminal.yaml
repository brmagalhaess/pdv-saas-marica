# Run on the store computer. It continues operating when cloud is unavailable.
name: pdv2-terminal
services:
  terminal:
    image: pdv2-terminal:${PDV_VERSION:-2.0.0}
    build: {context: ., dockerfile: infra/Dockerfile.terminal}
    environment:
      PDV_ENV: production
      PDV_VERSION: ${PDV_VERSION:-2.0.0}
      PDV_TERMINAL_HOST: 0.0.0.0
      PDV_TERMINAL_PORT: "8010"
      PDV_TERMINAL_DB: /data/terminal.sqlite3
      PDV_TERMINAL_DATA: /data
      # Caixas adicionais (rede entre caixas, 8011/TCP e 8012/UDP) exigem o terminal nativo: a rede
      # do contêiner não é a da loja. Aqui a escuta fica desligada e a tela não oferece o código.
      PDV_LAN_DISABLED: "1"
      # Docker Desktop routes this hostname to the macOS host, where CUPS
      # owns the USB printer queue. Native Linux deployments can override it.
      CUPS_SERVER: host.docker.internal:631
      PDV_PRINT_BRIDGE_URL: http://host.docker.internal:8020
      PDV_PRINT_BRIDGE_TOKEN: ${PDV_PRINT_BRIDGE_TOKEN:-}
    ports: ["127.0.0.1:8010:8010"]
    volumes: [terminal_data:/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  terminal_data:
