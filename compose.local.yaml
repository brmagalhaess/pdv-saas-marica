name: pdv2-local
x-cloud-env: &cloud-env
  PDV_ENV: development
  PDV_DEBUG: "1"
  PDV_SECRET_KEY: ${PDV_SECRET_KEY:?Run scripts/init_local.py}
  DATABASE_URL: postgresql://pdv2:${POSTGRES_PASSWORD:?Run scripts/init_local.py}@db:5432/pdv2
  PDV_ALLOWED_HOSTS: localhost,127.0.0.1,cloud,testserver
  PDV_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  PDV_TRUST_PROXY: "1"
  PDV_TRUSTED_PROXY_CIDRS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  PDV_LICENSE_PRIVATE_KEY_FILE: /run/secrets/license_private
  PDV_LICENSE_PUBLIC_KEY_FILE: /run/secrets/license_public
  PDV_ENCRYPTION_KEY: ${PDV_ENCRYPTION_KEY:?Run scripts/init_local.py}
  PDV_ADMIN_EMAIL: admin@pdv2.local
  PDV_ADMIN_PASSWORD: ${PDV_ADMIN_PASSWORD:?Run scripts/init_local.py}
  PDV_DEMO_EMAIL: gestor@pdv2.local
  PDV_DEMO_PASSWORD: ${PDV_DEMO_PASSWORD:?Run scripts/init_local.py}
  PDV_DEMO_PIN: ${PDV_DEMO_PIN:?Run scripts/init_local.py}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdv2
      POSTGRES_USER: pdv2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pdv2 -d pdv2"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: pdv2-cloud:local
    build: {context: ., dockerfile: infra/Dockerfile.cloud}
    command: [python, manage.py, migrate, --noinput]
    environment: *cloud-env
    depends_on: {db: {condition: service_healthy}}
    secrets: [license_private, license_public]
    restart: "no"
  cloud:
    image: pdv2-cloud:local
    build: {context: ., dockerfile: infra/Dockerfile.cloud}
    environment: *cloud-env
    depends_on: {migrate: {condition: service_completed_successfully}}
    secrets: [license_private, license_public]
    volumes: [backup_status:/backup-status:ro]
    expose: ["8080"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    image: pdv2-cloud:local
    command: [python, -m, operations.worker]
    environment: *cloud-env
    depends_on: {cloud: {condition: service_healthy}}
    secrets: [license_private, license_public]
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:8000:80"]
    volumes: [./infra/Caddyfile.local:/etc/caddy/Caddyfile:ro]
    depends_on: {cloud: {condition: service_healthy}}
    restart: unless-stopped
  terminal:
    image: pdv2-terminal:local
    build: {context: ., dockerfile: infra/Dockerfile.terminal}
    environment:
      PDV_ENV: development
      PDV_TERMINAL_HOST: 0.0.0.0
      PDV_TERMINAL_PORT: "8010"
      PDV_TERMINAL_DB: /data/terminal.sqlite3
      PDV_TERMINAL_DATA: /data
      PDV_TERMINAL_ALLOWED_CLOUD_HOSTS: cloud,host.docker.internal,localhost,127.0.0.1
    ports: ["127.0.0.1:8010:8010"]
    volumes: [terminal_data:/data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  backup:
    image: pdv2-backup:local
    build: {context: ., dockerfile: infra/Dockerfile.backup}
    environment:
      PGHOST: db
      PGDATABASE: pdv2
      PGUSER: pdv2
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
      RESTIC_REPOSITORY: /backups
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Run scripts/init_local.py}
      BACKUP_INTERVAL_SECONDS: "3600"
    depends_on: {db: {condition: service_healthy}}
    volumes: [backup_data:/backups, backup_status:/status]
    restart: unless-stopped
secrets:
  license_private: {file: ./.runtime/license-private.pem}
  license_public: {file: ./.runtime/license-public.pem}
volumes:
  postgres_data:
  terminal_data:
  backup_data:
  backup_status:
