# Import in Dokploy as a Docker Compose project. Attach HTTPS domain to cloud:8080.
# Secrets are generated by the server itself (service secrets-init) into the
# pdv2_secrets volume on the first deploy and reused afterwards; nothing secret
# is typed in the Dokploy panel. See docs/DEPLOY-DOKPLOY.md.
name: pdv2
x-env: &env
  PDV_ENV: production
  PDV_DEBUG: "0"
  PDV_VERSION: ${PDV_VERSION:-2.0.0}
  PDV_SECRET_KEY_FILE: /secrets/django_secret_key
  DATABASE_URL: postgresql://pdv2@pdv2-db:5432/pdv2
  PDV_DATABASE_PASSWORD_FILE: /secrets/db_password
  PDV_ALLOWED_HOSTS: ${PDV_DOMAIN:?Set the real domain},127.0.0.1,localhost
  PDV_CSRF_TRUSTED_ORIGINS: https://${PDV_DOMAIN:?Set the real domain}
  PDV_TRUST_PROXY: "1"
  PDV_TRUSTED_PROXY_CIDRS: ${PDV_TRUSTED_PROXY_CIDRS:?Set trusted Dokploy proxy network CIDR}
  PDV_LICENSE_PRIVATE_KEY_FILE: /secrets/license-private.pem
  PDV_LICENSE_PUBLIC_KEY_FILE: /secrets/license-public.pem
  PDV_RELEASE_PRIVATE_KEY_FILE: /secrets/release-private.pem
  PDV_RELEASE_PUBLIC_KEY_FILE: /secrets/release-public.pem
  PDV_ENCRYPTION_KEY_FILE: /secrets/encryption_key
  PDV_PLATFORM_MFA_REQUIRED: ${PDV_PLATFORM_MFA_REQUIRED:-1}
  PDV_ENABLE_DJANGO_ADMIN: ${PDV_ENABLE_DJANGO_ADMIN:-0}
  PDV_LOG_LEVEL: ${PDV_LOG_LEVEL:-INFO}
  PDV_ASAAS_WEBHOOK_TOKEN: ${PDV_ASAAS_WEBHOOK_TOKEN:-}
  PDV_ALLOW_LIVE_FISCAL: ${PDV_ALLOW_LIVE_FISCAL:-0}
  # 1 only when RESTIC_REPOSITORY points outside this VPS (S3/B2...).
  PDV_BACKUP_OFFSITE: ${PDV_BACKUP_OFFSITE:-0}
  PDV_EMAIL_HOST: ${PDV_EMAIL_HOST:-}
  PDV_EMAIL_PORT: ${PDV_EMAIL_PORT:-587}
  PDV_EMAIL_USER: ${PDV_EMAIL_USER:-}
  PDV_EMAIL_PASSWORD: ${PDV_EMAIL_PASSWORD:-}
  PDV_DEFAULT_FROM_EMAIL: ${PDV_DEFAULT_FROM_EMAIL:-}
x-service: &service
  image: pdv2-cloud:${PDV_VERSION:-2.0.0}
  build: {context: ., dockerfile: infra/Dockerfile.cloud}
  environment: *env
  volumes: [pdv2_secrets:/secrets:ro]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
services:
  # One-shot: creates in pdv2_secrets only the secrets that do not exist yet
  # (never overwrites). Runs as 10001:70 (app user, postgres group), no root.
  # Old installs: a secret variable still set in the panel seeds the missing
  # file with the same value, and a different value stops the deploy. With any
  # of them set, missing license/release PEM files stop the deploy too (paired
  # terminals trust the old pairs) unless PDV_SECRETS_NOVO_PAR=1.
  secrets-init:
    image: pdv2-cloud:${PDV_VERSION:-2.0.0}
    build: {context: ., dockerfile: infra/Dockerfile.cloud}
    command: [python, -m, operations.secrets_init]
    user: "10001:70"
    environment:
      PDV_SECRETS_DIR: /secrets
      PDV_SECRET_KEY: ${PDV_SECRET_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PDV_ENCRYPTION_KEY: ${PDV_ENCRYPTION_KEY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      PDV_SECRETS_NOVO_PAR: ${PDV_SECRETS_NOVO_PAR:-0}
    volumes: [pdv2_secrets:/secrets]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
    restart: "no"
  db:
    image: postgres:17-alpine
    # O Dokploy reescreve as redes dos serviços e descarta o apelido abaixo;
    # o nome fixo do container continua resolvendo em qualquer rede do banco.
    container_name: pdv2-db
    environment:
      POSTGRES_DB: pdv2
      POSTGRES_USER: pdv2
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes: [postgres_data:/var/lib/postgresql/data, pdv2_secrets:/secrets:ro]
    depends_on: {secrets-init: {condition: service_completed_successfully}}
    # Nome exclusivo: no Dokploy o cloud também fica na rede compartilhada,
    # onde outros projetos têm serviços chamados "db".
    networks:
      default:
        aliases: [pdv2-db]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pdv2 -d pdv2"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *service
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    restart: "no"
  cloud:
    <<: *service
    expose: ["8080"]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    volumes: [pdv2_secrets:/secrets:ro, backup_status:/backup-status]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *service
    command: [python, -m, operations.worker]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      cloud: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-float(pathlib.Path('/tmp/pdv2-worker-health').read_text())<120"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  backup:
    image: pdv2-backup:${PDV_VERSION:-2.0.0}
    build: {context: ., dockerfile: infra/Dockerfile.backup}
    environment:
      PGHOST: pdv2-db
      PGDATABASE: pdv2
      PGUSER: pdv2
      PGPASSWORD_FILE: /secrets/db_password
      # Provisional default: local repository in the backup_status volume (same
      # VPS, not offsite). Point it to S3/B2 and set PDV_BACKUP_OFFSITE=1.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/status/restic}
      RESTIC_PASSWORD_FILE: /secrets/restic_password
      BACKUP_SECRETS_DIR: /secrets
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BACKUP_INTERVAL_SECONDS: "3600"
      BACKUP_PRUNE: ${BACKUP_PRUNE:-0}
      # 1 holds the automatic backups (restore on a new VPS: the empty new
      # database must not become the newest snapshot nor prune the real ones).
      BACKUP_PAUSADO: ${BACKUP_PAUSADO:-0}
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    volumes: [backup_status:/status, pdv2_secrets:/secrets:ro]
    restart: unless-stopped
volumes:
  postgres_data:
  backup_status:
  # Server-generated secrets. Never `down -v`: losing it without the recovery
  # kit loses the encryption key, the license/release keys and the backup password.
  pdv2_secrets:
